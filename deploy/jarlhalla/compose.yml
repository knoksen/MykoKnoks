name: mykoknoks-public
services:
  api:
    build:
      context: ../../backend
    environment:
      APP_ENV: production
      ROOT_PATH: /mykoknoks-api
      CORS_ORIGINS: https://mykoknoks.jarlhalla.com
      DATABASE_URL: sqlite:////data/features.sqlite
      MET_USER_AGENT: MykoKnoks/1.1.0 https://mykoknoks.jarlhalla.com
    volumes:
      - features:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: ../..
      dockerfile: deploy/jarlhalla/Dockerfile.web
    ports:
      - 127.0.0.1:18180:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  features:
