# Include ONLY inside the existing HTTPS server for mykoknoks.jarlhalla.com.
# Keep its document root, location /, certificates and other hostnames unchanged.
location = /app { return 308 /app/; }
location ^~ /app/ {
    proxy_pass http://127.0.0.1:18180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /mykoknoks-api { return 308 /mykoknoks-api/; }
location ^~ /mykoknoks-api/ {
    proxy_pass http://127.0.0.1:18180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
