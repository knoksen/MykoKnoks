[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mykoknoks-api"
version = "0.2.0"
description = "Nordic fungal habitat, occurrence and fruiting forecast API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "h3>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]
ml = [
  "pandas>=2.3,<3",
  "pyarrow>=21,<22",
  "scikit-learn>=1.7,<2",
  "joblib>=1.5,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
