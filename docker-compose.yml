services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mykoknoks
      POSTGRES_USER: mykoknoks
      POSTGRES_PASSWORD: mykoknoks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mykoknoks -d mykoknoks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://mykoknoks:mykoknoks@db:5432/mykoknoks
      MET_USER_AGENT: MykoKnoks/0.1 https://github.com/knoksen/MykoKnoks
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
